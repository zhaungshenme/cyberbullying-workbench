# Replace domain/certificate paths. Confirm the server owns this domain.
server {
    listen 443 ssl;
    server_name workbench.example.org;
    ssl_certificate /etc/letsencrypt/live/workbench.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/workbench.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 9m;
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}
server {
    listen 80;
    server_name workbench.example.org;
    return 301 https://$host$request_uri;
}
