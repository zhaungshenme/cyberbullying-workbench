# Single GPU pilot; real approved train/dev files are required.
model_name_or_path: /srv/models/Qwen3-32B
trust_remote_code: false
stage: sft
do_train: true
do_eval: true
finetuning_type: lora
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target: all
dataset_dir: /srv/data/cb_gold/sft
dataset: cb_train
eval_dataset: cb_dev
template: qwen3
enable_thinking: false
cutoff_len: 2048
packing: false
preprocessing_num_workers: 4
dataloader_num_workers: 2
logging_steps: 10
save_steps: 100
eval_strategy: steps
eval_steps: 100
save_total_limit: 3
plot_loss: true
overwrite_output_dir: false
save_only_model: false
report_to: none
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 5.0e-5
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
seed: 42
data_seed: 42
ddp_timeout: 180000000
quantization_method: bitsandbytes
quantization_bit: 4
quantization_type: nf4
double_quantization: true
output_dir: /srv/artifacts/cb-qwen3-32b-qlora/run-001
